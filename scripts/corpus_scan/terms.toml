# Term list for the Common Corpus full-text scan (scripts/corpus_scan/scan_parquet.py).
#
# Three tiers:
#   strong  - always a hit.
#   weak    - a hit only when a strong or context term falls within
#             `proximity_words` of it (e.g. "ether", "opium", "intoxication").
#   context - visionary-experience language; never a hit by itself, but
#             rescues nearby weak terms and is recorded in matched_terms.
#
# rescued_by = [...] limits which nearby terms rescue a weak term: context
# labels, plus "strong" for any strong term. Cannabis terms are rescued only by
# visionary language (visions, hallucination, ecstasy, depersonalisation, time
# distortion), not by dreams, exhilaration or intoxication: the archive takes
# cannabis accounts only when they evoke psychedelic-like states.
#
# A weak term with needs = "strong" is rescued only by a nearby strong term
# (used for generic medical/metaphorical words: intoxication, chloroform,
# belladonna). The default, needs = "any", accepts a strong or context term.
#
# Pattern conventions:
#   - Python `re` syntax, matched case-insensitively unless case_sensitive = true.
#   - Use \b only at the very start or end of a pattern; the scanner rewrites
#     edge \b into Unicode-aware boundaries for DuckDB's RE2 prefilter.
#   - No capturing groups; use (?:...).
#   - OCR tolerance is kept modest: common letter confusions (i/l/1, e/c,
#     long s as f or s), optional hyphens and spaces in compounds.
#   - Literal TOML strings ('...') cannot contain a single quote, so apostrophes
#     are written as `.` (matches ' and ’).
#   - min_year drops matches in rows dated before that year (undated rows keep
#     them unless require_year = true); used for modern coinages that collide
#     with older words or abbreviations.
#
# Vocabulary seeds: the archive's own texts (nitrous oxide:ether/,
# latin-american-psychedelic-research/, data/squarespace-import/body-text/).

[settings]
proximity_words = 60      # weak term needs strong/context within this many words
window_words = 300        # total words in each excerpt, centred on the hit
max_windows_per_doc = 25  # cap per document; strong windows kept first

# ---------------------------------------------------------------------------
# Peyote, mescaline, San Pedro
# ---------------------------------------------------------------------------

[[term]]
label = "peyote"
tier = "strong"
group = "peyote-mescaline"
patterns = [
  '\bpe[yij][o0]t[l1e]s?\b',          # peyote, peyotl, peiote, peyotes
  '\bpey[o0]t[e3]ros?\b',
  '\bpeyotism[eo]?\b',
  '\bh[ií]kuri\b', '\bh[ií]kul[ií]\b', '\bj[ií]cul[ií]\b',
  '\bmescal[- ]?(?:buttons?|beans?|button-?s)\b',
  '\bdry whisk(?:e?y)\b',
  '\blophophora\b', '\banhal[o0]n(?:ium|ia|in|ine)\b', '\blophophorin[e]?\b',
  '\bpellotin[e]?\b', '\bechinocactus william[s]?ii\b',
]

[[term]]
label = "mescaline"
tier = "strong"
group = "peyote-mescaline"
min_year = 1890            # earlier "Mescaline" is OCR for Muscatine; 1910s silk "messaline" excluded below
patterns = [
  '\bmes[ck]al[il1]n[ea]?\b(?! (?:silk|satin|petticoat|dress|gown|waist|skirt|blouse|ribbon|\$))',
  '\bmezcal[il1]n[ae]?\b', '\bme[sz]kal[il1]n\b',
]

[[term]]
label = "san pedro cactus"
tier = "strong"
group = "peyote-mescaline"
patterns = [
  '\bsan pedro cact(?:us|i)\b', '\btrichocereus\b', '\bhuachuma\b', '\bwachuma\b',
  '\bachuma\b', '\bcactus de san pedro\b',
]

# ---------------------------------------------------------------------------
# Cannabis preparations
# ---------------------------------------------------------------------------

[[term]]
label = "hashish"
tier = "weak"
rescued_by = ["visions/hallucinations", "ecstasy/mystical states", "altered perception/self"]
group = "cannabis"
patterns = [
  '\bhash[e]?[e]?sh\b', '\bhashish\b', '\bhasheesh\b', '\bhashheesh\b', '\bhachish\b',
  '\bha[sſf]ch[i1l]s[cſf]?h\b',       # haschisch, haschish, hafchifch
  '\bhach[i1l]s?ch\b',                 # hachisch, hachich
  '\bhasch[i1l]sch\b', '\bhasch[i1l]ch\b', '\bhaschischin\b', '\bhaschich\b',
  '\bhachís\b',                       # Spanish hachís (plain "hachis" = French minced meat)
  '\bhascisc[ei]?\b', '\bascisc\b', '\bhascisch\b', # Italian
  '\bhaxixe?\b',                       # Portuguese haxixe
  '\bhaschisch\w*\b', '\bhachichin\w*\b', '\bhashshash\w*\b',
  '\bassassin[s]? .{0,30}hash',        # Old Man of the Mountain legend
  '\bdawamesk\b', '\bdawamesc\b', '\bdawamesque\b',
  '\besrar\b', '\bchurrus\b', '\bcharas (?:or|and|,) \w+', '\b(?:ganja|bhang),? (?:and|or) charas\b',
]

[[term]]
label = "hashish (ambiguous forms)"
tier = "weak"
rescued_by = ["visions/hallucinations", "ecstasy/mystical states", "altered perception/self"]
group = "cannabis"
patterns = [   # minced meat, Latin "charas", Kiev, OCR surnames, dictionary headwords
  '\bhachis\b', '\bcharas\b', '\bkif\b', '\bkief\b', '\bmaj[o0][o0]n\b', '\bmaj[o0]un\b', '\bmadj[o0]un\b', '\bma.j[uo]un\b',
]

[[term]]
label = "cannabis indica"
tier = "weak"
rescued_by = ["visions/hallucinations", "ecstasy/mystical states", "altered perception/self"]
group = "cannabis"
patterns = [
  '\bcannabis indica\b', '\bcannabis sativa var\.? indica\b', '\bcannabi[n]e\b', '\bcannabin(?:on|ol)\b',
  '\bindian hemp\b', '\bindischer? hanf\w*\b', '\bchanvre indien\b',
  '\bcanapa indiana\b', '\bc[aá][nñ]amo [ií]ndico\b', '\bc[aâ]nhamo da [ií]ndia\b',
  '\bextractum cannabis\b', '\btinct(?:ure|ura) (?:of )?cannabis\b',
