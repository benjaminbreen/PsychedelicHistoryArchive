label = "chloroform/anaesthesia"
tier = "weak"
needs = "strong"
group = "nitrous-ether"
patterns = ['\bchloroform\w*', '\bchloral\b', '\ban(?:a|ae|æ)?sthe[st]\w*', '\bnarcos[ei]\w*']

# ---------------------------------------------------------------------------
# (Opium, kava, coca and generic intoxication were removed on 2026-10-16:
#  not psychedelic, and they flooded review with passing mentions.)
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Context: visionary-experience language (never a hit alone)
# ---------------------------------------------------------------------------


[[term]]
label = "visions/hallucinations"
tier = "context"
group = "context"
patterns = [
  '\bvisions\b', '\bvisionary\b',      # singular "vision" is mostly optics/medicine '\bhallucinat\w*', '\bhalluzinat\w*', '\bhalluzination\w*', '\bhallucination\w*',
  '\bvisione[ns]?\b', '\bvisiones\b', '\bvis[õo]es\b', '\bvisioni\b', '\balucinaci[oó]n\w*', '\balucina[cç][õo]es\b',
  '\ballucinazion\w*', '\bphantasm\w*', '\bfantasmagor\w*', '\bphantasmagor\w*', '\bsinnest[aä]uschung\w*',
  '\btrugbild\w*', '\bfarbenvision\w*', '\bkal[ea][i]?dos[ck]op\w*', '\bsyn(?:a|ae|æ)?sthe[st]\w*',
]

[[term]]
label = "ecstasy/mystical states"
tier = "context"
group = "context"
patterns = [
  '\becsta(?:sy|sies|tic|tically)\b', '\bextase\b', '\bextatique\b', '\bekstase\b', '\bverz[uü]ckung\b', '\b[eé]xtasis\b',
  '\b[eê]xtase\b', '\bestasi\b', '\bestatico\b', '\becstasis\b', '\braptus\b', '\bunio mystica\b',
  '\bineffab\w*', '\bmystic(?:al)? (?:experience|state|consciousness|revelation|insight|vision)\w*',
  '\bcosmic consciousness\b', '\bexp(?:ansion|anded) (?:of )?(?:the )?(?:mind|consciousness)\b', '\baltered states?\b',
  '\bbewu(?:ss|ß)tseinserweiter\w*', '\btrance\b', '\btranse\b', '\bbeatific\b', '\bb[eé]atitude\b',
]

[[term]]
label = "altered perception/self"
tier = "context"
group = "context"
patterns = [
  '\bdepersonali[sz]\w*', '\bderealiz\w*', '\bdouble consciousness\b', '\bdoppeltes? bewu(?:ss|ß)tsein\b',
  '\bout of (?:the|my) body\b', '\bloss of (?:the )?(?:self|ego|identity)\b', '\bego[- ]?(?:loss|death|dissolution)\b',
  '\btime (?:seemed|stood still|was annihilated|ceased)\b', '\bsense of time\b', '\bseemed to (?:float|fly|expand|dissolve)\b',
  '\bsensation of floating\b', '\bintensified colou?rs?\b', '\bcolou?rs? (?:of|more) (?:unearthly|extraordinary|brillian\w+|vivid)\b',
]

# Weaker context: rescues ether / nitrous oxide / laughing gas (default rescuers),
# but not cannabis or generic plant terms, whose rescued_by lists leave these out.
[[term]]
label = "exhilaration"
tier = "context"
group = "context"
patterns = ['\bexhilarat\w*', '\bthrill\w*', '\bpleasurable (?:sensations?|feelings?)\b']

[[term]]
label = "dreams/reverie"
tier = "context"
group = "context"
patterns = [
  '\bdreams?(?:like)?\b', '\breverie\b', '\br[eê]ve(?:rie)?s?\b',
  '\bträum\w*', '\btraum(?:e|en|bild\w*|zustand\w*|haft\w*|leben|welt)?\b',
]

# Rescues bare "LSD" only (its rescued_by names it); never a hit alone.
[[term]]
label = "drug vocabulary"
tier = "context"
group = "context"
patterns = [
  '\bdrugs?\b', '\bnarcotics?\b', '\bheroin\b', '\bmari[hj]uana\b', '\bhallucinogen\w*', '\bpsychedel\w*',
  '\bsandoz\b', '\bleary\b', '\bacid\b', '\btrips?\b', '\baddict\w*', '\bdangerous drugs?\b',
]
