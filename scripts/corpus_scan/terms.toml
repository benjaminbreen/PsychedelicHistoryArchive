# hyphenated "eter-nity" are excluded; Latin/poetic "aether" is dropped.
patterns = [
  '\bether\b(?!-| ?(?:waves?|vibrations?|of space|space|drift|theory|ic)\b)', '\béther\b(?! (?:cosmique|lumineux)\b)',
  '\betere\b(?! cosmico)', '\béter\b', '\bsulph?uric ether\b', '\bschwefeläther\b',
]

