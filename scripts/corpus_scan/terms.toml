patterns = [
  '\b(?:breath\w*|inhal\w*|respir\w*|took|taken|taking) (?:of )?(?:the |some )?(?:nitrous oxide|laughing gas|gaseous oxide|exhilarating gas)\b',
  '\b(?:effects?|influence|intoxication|exhilaration|sensations?) (?:of|from|produced by) (?:the )?(?:nitrous oxide|laughing gas|gaseous oxide|protoxyde d.azote|lachgas|stickoxydul)\b',
  '\blaughing[- ]gas (?:party|parties|frolic\w*|exhibition\w*|lecture\w*|entertainment\w*)\b',
]

[[term]]
label = "nitrous oxide"
tier = "weak"
rescued_by = ["strong", "visions/hallucinations", "ecstasy/mystical states", "altered perception/self", "exhilaration", "dreams/reverie"]     # mostly chemistry tables and dental adverts on its own
group = "nitrous-ether"
patterns = [
  '\bn[i1l]trous ox[iy]de?\b', '\bgaseous oxide of azote\b', '\bnitrous oxyd\b', '\boxyde? (?:of|d.)azote\b',
  '\bprotoxyde d.azote\b', '\bprot[oó]xido de az[oó]e\b', '\b[oó]xido nitroso\b', '\bossido nitroso\b', '\bprotossido d.azoto\b',
  '\bstick(?:stoff)?ox[iy]dul\w*\b', '\bdistickstoffmonox[iy]d\b',
]

[[term]]
label = "laughing gas"
tier = "weak"
rescued_by = ["strong", "visions/hallucinations", "ecstasy/mystical states", "altered perception/self", "exhilaration", "dreams/reverie"]     # "teeth extracted without pain by laughing gas"
group = "nitrous-ether"
patterns = [
  '\blaughing[- ]gas\b', '\bgaz hilarant\b', '\bgas hilarante\b', '\bg[aá]s hilariante\b', '\bgas esilarante\b',
  '\blachgas\w*\b', '\bexhilarating gas\b', '\bparadise gas\b',
]

[[term]]
label = "ether inhalation"
tier = "weak"
rescued_by = ["strong", "visions/hallucinations", "ecstasy/mystical states", "altered perception/self", "exhilaration", "dreams/reverie"]
group = "nitrous-ether"
patterns = [
  '\b(?:under|inhal\w*|breath\w*|took|taking|taken|sniff\w*|drank|drink\w*) (?:the )?(?:influence of )?(?:sulph?uric )?ether\b',
  '\bether (?:was|had been|being) (?:administered|given|inhaled)\b', '\b[eé]ther (?:inhal[eé]|respir[eé])\b',
  '\b(?:inhal\w+|respir\w+) (?:de )?l.[eé]ther\b', '\bsous (?:l.influence de )?l.[eé]ther\b', '\b[aä]ther(?:narkose|einatmung)\w*\b',
]

[[term]]
label = "ether"
tier = "weak"
needs = "strong"        # bare "ether" is mostly poetry ("born of blue ether") and physics
group = "nitrous-ether"
