tier = "strong"
group = "nitrous-ether"
patterns = [
  '\ban(?:a|ae|æ)?sthetic revelation\b', '\ban(?:a|ae|æ)?sthetic (?:mystic\w*|ecsta\w*|trance)\b',
  '\bnothing exists but thoughts\b', '\bpluriverse\b',
  '\bether[- ]?(?:drink\w*|frolic\w*|mania\w*|habit|eat\w*|intoxicat\w*|vision\w*|dream\w*|jag|party|parties|sniff\w*|addict\w*)\b',
  '\b(?:drink\w*|sniff\w*|inhal\w*) (?:of )?ether (?:for|as) (?:pleasure|an? intoxicant|intoxication)\b',
  '\b[eé]th[eé]rom[aa]n\w*\b', '\b[aä]therrausch\w*\b', '\b[aä]thers[uü]cht\w*\b', '\b[aä]thertrink\w*\b',
  '\bchloroform[- ]?(?:dream\w*|vision\w*|habit|mania)\b',
]

[[term]]
label = "nitrous oxide experience"
tier = "strong"
